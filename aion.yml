    CardAutoloadRequestModel:
      type: object
      properties:
        scheduleType:
          type: string
          description: The recurrence basis of the autoload schedule.
          enum:
            - MONTHLY
            - WEEKLY
            - DAILY
        dayOfTheMonth:
          type: integer
          description: The day of the month the autoload runs on. Required, and only applicable, when `scheduleType` is `MONTHLY`.
          example: 1
        dayOfWeek:
          type: string
          description: The day of the week the autoload runs on. Required, and only applicable, when `scheduleType` is `WEEKLY`.
          enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
        includedDaysOfWeek:
          type: array
          description: The days of the week the autoload runs on. Only applicable when `scheduleType` is `DAILY`.
          items:
            type: string
            enum:
              - MONDAY
              - TUESDAY
              - WEDNESDAY
              - THURSDAY
              - FRIDAY
              - SATURDAY
              - SUNDAY
        scheduleTime:
          type: string
          description: |-
            The time of day (whole hour, in `scheduleTimezone`) the autoload runs at, formatted as `HH:00`.
          example: '09:00'
        scheduleTimezone:
          type: string
          description: The IANA timezone identifier that `scheduleTime` is evaluated in.
          example: 'Asia/Dubai'
        skipIfBalanceAtLeast:
          type: number
          format: decimal
          description: When set, the autoload is skipped for a cycle if the card balance is already at or above this amount.
        amount:
          type: number
          format: decimal
          description: The amount to load onto the card each time the autoload schedule runs.
          example: '100.00'
      required:
        - scheduleType
        - scheduleTime
        - scheduleTimezone
        - amount
    CardAutoloadResponseModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is a system-generated unique identifier for the autoload configuration.
        cardUuid:
          type: string
          description: This field contains a unique identifier of the card the autoload is set up on.
        scheduleType:
          type: string
          enum:
            - MONTHLY
            - WEEKLY
            - DAILY
        dayOfTheMonth:
          type: integer
        dayOfWeek:
          type: string
        includedDaysOfWeek:
          type: array
          items:
            type: string
        scheduleTime:
          type: string
        scheduleTimezone:
          type: string
        skipIfBalanceAtLeast:
          type: number
          format: decimal
        amount:
          type: number
          format: decimal
        nextLoadAt:
          type: string
          format: date-time
          description: |-
            The next server-computed occurrence at which this schedule will run. This is `null` for
            incomplete schedules.
      required:
        - uuid
        - cardUuid
        - scheduleType
        - amount
    CardAutoloadResponseList:
      type: object
      properties:
        autoLoadConfig:
          type: array
          items:
            $ref: '#/components/schemas/CardAutoloadResponseModel'
        totalElements:
          type: integer
          format: int64

    TransactionTagModel:
      type: object
      properties:
        uuid:
          type: string
          description: |-
            This is a system-generated unique identifier for the tag. Required when deleting a tag.
        tag:
          type: string
          description: |-
            The name of the tag. This is free-form text (max 100 characters) and must not contain the
            `|` character. Required when creating/setting a tag; not required (and ignored) when
            deleting a tag by `uuid`.
          example: 'grocery'
        status:
          type: string
          example: 'ACTIVE'
    TransactionTagsRequestModel:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TransactionTagModel'
      required:
        - tags
    TransactionTagsResponseModel:
      type: object
