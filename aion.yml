      summary: Delete a Webhook
      description: This endpoint allows you to delete an existing webhook
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          description: This is the unique identifier of the webhook.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook Deleted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error60009'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /webhook/{uuid}/status:
    put:
      tags:
        - 'Webhook'
      summary: Updates the status of Webhook
      description: This endpoint allows you to update the status of an existing webhook
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          description: This is the unique identifier of the webhook.
          required: true
          schema:
            type: string
        - name: enable
          in: query
          description: Webhook Status
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponseModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error60009'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/card/{uuid}/autoload:
    get:
      tags:
        - 'Card'
      summary: Get Autoload Configuration on Card
      description: |-
        This endpoint retrieves the autoload configuration set up on a Card, including the
        system-computed `nextLoadAt` occurrence of the schedule.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the card.
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAutoloadResponseModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
    post:
      tags:
        - 'Card'
      summary: Create Autoload on Card
      description: |-
        This endpoint creates a new autoload schedule on a Card. An autoload schedule automatically
        loads a fixed `amount` onto a card on a recurring `scheduleType` (`MONTHLY`, `WEEKLY` or `DAILY`)
        basis, so that the card owner does not need to be manually loaded every cycle.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the card.
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardAutoloadRequestModel'
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
    put:
      tags:
        - 'Card'
      summary: Update Autoload on Card
      description: |-
        This endpoint updates the existing autoload schedule on a Card.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the card.
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardAutoloadRequestModel'
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
    delete:
      tags:
        - 'Card'
      summary: Suspend Autoload on Card
      description: |-
        This endpoint suspends (removes) the autoload schedule on a Card. There is no separate
        pause/resume state — deleting the schedule is how autoload is switched off, and a new
        schedule must be created to switch it back on.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the card.
          required: true
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/card/autoload:
    get:
      tags:
        - 'Card'
      summary: List All Autoload Configurations
      description: |-
        This endpoint retrieves a paginated list of all the autoload configurations set up across
        cards under your company.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: page
          in: query
          schema:
            type: integer
        - name: size
          in: query
          schema:
            type: integer
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDir
          in: query
          schema:
            type: string
            enum:
              - ASC
              - DESC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAutoloadResponseList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/transaction/{uuid}/tag:
    get:
      tags:
        - 'Transaction'
      summary: Get Transaction Tags
      description: |-
        This endpoint retrieves all the tags currently attached to a transaction.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          description: |-
            This field contains a unique identifier of the transaction.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionTagsResponseModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
    post:
      tags:
        - 'Transaction'
      summary: Add Transaction Tags
      description: |-
        This endpoint adds one or more tags to a transaction, in addition to any tags it already has.
        Tags are free-form text (e.g. `medical`, `grocery`) - there is no fixed allow-list, so any
        tag name can be created dynamically as long as it meets the length and character constraints.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          description: |-
            This field contains a unique identifier of the transaction.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionTagsRequestModel'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
    put:
      tags:
        - 'Transaction'
      summary: Replace Transaction Tags
      description: |-
        This endpoint replaces the full set of tags on a transaction. Any existing tag that is not
        included in the request is removed, and any new tag included in the request is created.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          description: |-
            This field contains a unique identifier of the transaction.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionTagsRequestModel'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
    delete:
      tags:
        - 'Transaction'
      summary: Delete Transaction Tags
      description: |-
        This endpoint removes one or more tags from a transaction. Each tag in the request must be
        identified by its `uuid` (rather than its `tag` name).
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          description: |-
            This field contains a unique identifier of the transaction.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionTagsRequestModel'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/transaction/tags:
    get:
      tags:
        - 'Transaction'
      summary: Search Transaction Tags
      description: |-
        This endpoint retrieves the distinct set of tag names that have been used across your
        company's transactions, optionally filtered by tag name, user or card.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: tag
          in: query
          schema:
            type: string
        - name: userUuid
          in: query
          schema:
            type: string
        - name: cardUuid
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionTagsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
