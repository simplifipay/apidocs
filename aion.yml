          type: array
          items:
            $ref: '#/components/schemas/TransactionTagModel'
    TransactionTagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          description: The distinct tag names matching the search criteria.
        total:
          type: integer
          format: int64

