        - fundRequestType
    DocumentUploadModel:
      type: object
      properties:
        file:
          type: string
          format: binary
        documentModel:
          $ref: '#/components/schemas/DocumentModel'
      required:
        - file
        - documentModel
    DocumentModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is a system-generated unique identifier of the document
          example: 'e2a60b44-88ef-4102-a1ac-fb0f00a3fd3e'
        userUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the card holder that was
