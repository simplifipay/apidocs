    CardRequestModel:
      type: object
      properties:
        userUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the user
            that was created using the Create User API.
          example: 'f5ba1741-983f-4f51-8375-701461c5bacc'
        cardProgramUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the card program
            that was created using the Create Card Program API.
          example: '56db03b7-29ef-46e3-82ad-68b94abb051f'
        customerTitle:
          type: string
          description: |-
            This is a specific name for the user to be displayed on the card in addition
            to the cardholder name. This field adds another layer of individuality and exclusivity
            for the user. Also known as 4th line embossing.
          example: 'Founding Member'
        instrument:
          $ref: '#/components/schemas/InstrumentType'
      required:
        - userUuid
        - instrument
    CardResponseModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is a system-generated unique identifier of the card issued.
          example: '8105fb1b-852c-4d93-88eb-2fb2361d4b45'
        userUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the user
            that was created using the Create User API.
          example: '7ace3a56-3cb1-44db-a81d-2735e54c7c15'
        companyUuid:
          type: string
          description: This field contains a unique identifier of the company for which the card has been configured.
          example: '10cdeb1d-c3af-4288-b770-5d7620171f37'
        cardProgramUuid:
          type: string
          description: |-
            This is a system-generated unique identifier for the card program
            that was created using the Create Card Program API.
          example: 'dfb04381-3a10-4185-9ed3-5a97f43dd1a2'
        instrument:
          $ref: '#/components/schemas/InstrumentType'
        creationDate:
          type: string
          format: date-time
          description: This field contains the date on which the card was created.
          example: '2025-02-28 13:31:00'
        cardStatus:
          $ref: '#/components/schemas/CardStatusParameter'
        expiryDate:
          type: string
          description: |-
            This field contains the expiry date of the card.
            The format is `MM/yy`
          example: '12/31'
        maskedPan:
          $ref: '#/components/schemas/MaskedPanParameter'
        cardMode:
          type: string
          description: This field contains the mode of the card.
          example: 'PRIMARY'
          enum:
            - PRIMARY
            - SECONDARY
        currency:
          type: string
          description: This field contains the Primary currency of Card
          example: 'USD'
        customerTitle:
          type: string
          description: This field contains the fourth line embossing of the card.
          example: 'Founding Member'
        physicalCardUuid:
          type: string
          description: This is a system-generated unique identifier of the PHYSICAL card issued.
          example: 'a1f65835-be50-450c-a197-8676aa4565d0'
        linkedVirtualCardUuid:
          type: string
          description: This is a system-generated unique identifier of the linked VIRTUAL card.
          example: '86d3111d-6d55-45e0-91c1-32c1397f39ab'
      required:
        - uuid
        - userUuid
        - companyUuid
        - cardProgramUuid
        - instrument
        - creationDate
        - cardStatus
        - maskedPan
        - cardMode
        - currency
    CardRenewalModel:
      type: object
      properties:
        originalCardUuid:
          type: string
          description: This is a system-generated unique identifier of the card being renewed.
        renewedCardUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the renewed card
            that is issued in place of the original card.
      required:
        - originalCardUuid
        - renewedCardUuid
    InstrumentType:
      type: string
      description: This field specifies the type of card that is being issued.
      example: 'VIRTUAL'
      enum:
        - VIRTUAL
        - PHYSICAL
        - VIRTUAL_AND_PHYSICAL
    AmountModel:
      type: object
      properties:
        amount:
          type: number
          format: decimal
          description: This field contains the balance amount available for the card.
          example: '1234.56'
        currency:
          type: string
          description: This field contains the currency of Card
          example: 'AED'
      required:
        - amount
    CardStatusModel:
      type: object
      properties:
        status:
          type: string
          description: This field contains the status of the card.
          example: 'LOCKED'
          enum:
            - LOCKED
            - DISABLED
            - ACTIVATED
        reason:
          type: string
          description: This field specifies the reason for changing the card status.
          example: 'STOLEN'
          enum:
            - ALL_GOOD
            - STOLEN
            - LOST
            - FRAUDULENCE
            - SECURITY_VIOLATION
            - RESTRICTED
            - VOIDED
      required:
        - status
        - reason
    CardAmountModel:
      type: object
      properties:
        requestedAmount:
          type: number
          format: decimal
          description: This field contains the amount that has been requested to be loaded onto a card.
          example: '100.00'
        comments:
          type: string
          description: Comments related to the load request
      required:
        - requestedAmount

    FeesSetupModel:
      type: object
      description: |-
        Fee setup will have the information on amount to charge client with respect to operation type
      properties:
        entityType:
          type: string
          description: This field contains the entity type for which we want to setup fees
          example: 'CARD_PROGRAM_TEMPLATE'
          enum:
            - CARD_PROGRAM_TEMPLATE
            - CARD_PROGRAM
        entityUuid:
          type: string
          example: '6afa4246-9ecd-4dd0-9c7e-240b04ae8929'
          description: This is the entity uuid for which we want to charge fees for specific operations
        fees:
          type: array
          description: This array of objects contains fees setup configuration with respect to fee operation type
          items:
            $ref: '#/components/schemas/FeeConfigurationModel'
      required:
        - entityType
        - entityUuid
        - fees
    FeeConfigurationModel:
      type: object
      properties:
        feeOperationType:
          type: string
          description: This field contains the operation type for which we want to setup fees
          example: 'ATM_WITHDRAWAL'
          enum:
            - PRIMARY_VIRTUAL_CARD_ISSUANCE,
            - PRIMARY_VIRTUAL_CARD_RENEWAL,
            - SECONDARY_CARD_ISSUANCE,
            - SECONDARY_CARD_RENEWAL,
            - PHYSICAL_CARD_ISSUANCE,
            - PHYSICAL_CARD_RENEWAL,
            - ATM_WITHDRAWAL,
            - SUBSCRIPTION_FEE,
            - DELIVERY_CHARGE
        feeStatusType:
          type: string
          description: This field contains the status of the fee configuration
          example: 'ACTIVE'
          enum:
            - ACTIVE
            - INACTIVE
        feeAmount:
          type: number
          format: decimal
          description: This field indicates the amount to charge
          example: '5.10'
        currency:
          type: string
          description: This field tells the currency of on which fees will be detected
          example: 'USD'
        description:
          type: string
