          example: 'ATM Withdrawal Fee'
        feesDetectType:
          type: string
          description: This field contains fees Detect Type
          example: 'FIXED'
          enum:
            - FIXED
            - MULTIPLIER
        feesUuid:
          type: string
          description: This is a system-generated unique identifier of the fee configuration.
          example: 'e00507d5-f5a0-4951-9037-2b15ab852c88'
      required:
        - feeOperationType
        - feeAmount
        - currency
        - feesDetectType
    FeesStatusUpdateModel:
      type: object
      properties:
