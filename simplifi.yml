                  type: string
                  description: This field contains the unique identifier of raise funding
                companyUuid:
                  $ref: '#/components/schemas/CompanyUuidParameter'
                cardProgramUuid:
                  type: string
                  description: |-
                    This is a unique identifier for the program that was created using the Create Card Program API.
                  example: '57846713-07cf-4632-97c7-608cda4a1773'
                amount:
                  type: number
                  format: decimal
                  description: The amount which has been `LOAD` or `UNLOAD` in this raise funding
                  example: 10000.45
                transactionType:
                  type: string
