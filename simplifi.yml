            - eventType
            - eventPayload

    TransactionWebhook:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          properties:
            eventType:
              type: string
              description: 'TRANSACTION'
              example: 'TRANSACTION'
            eventPayload:
              type: object
              properties:
                transactionId:
