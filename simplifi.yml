      required:
        - userUuid
        - documentType
        - documentContext

    UserRequestModel:
      type: object
      properties:
        username:
          type: string
          description: |-
            This is a unique identifier of the user in the system. We recommend providing a unique name here.
          example: 'john.smith'
        firstName:
          type: string
          description: This is the first name of the user.
          example: 'John'
        middleName:
          type: string
          description: This is the middle name of the user.
          example: 'M'
        lastName:
          type: string
          description: This is the last name of the user.
          example: 'Smith'
        gender:
          type: string
          description: This is the gender of the user.
          example: 'MALE'
          enum:
            - MALE
            - FEMALE
        userDetail:
          $ref: '#/components/schemas/UserDetailModel'
        address:
          $ref: '#/components/schemas/AddressModel'
        contacts:
          type: array
          description: |-
            This array of objects is a collection of contact fields,
            possessing sub-fields explained in the rows below.
          items:
            $ref: '#/components/schemas/ContactModel'
      required:
        - username
        - firstName
        - lastName
        - userDetail
        - contact
    UserDetailModel:
      type: object
      properties:
        cardProgramUuid:
          type: string
          description: This field contains a unique identifier of the card program.
          example: 'a0f07d6c-d6e8-4bda-9dcc-f64fb3a720f6'
        dob:
          type: string
          format: date-time
          description: This field contains the Date of Birth of the card holder.
          example: 'yyyy-MM-dd HH:mm:ss'
        roleName:
          type: string
          description: This field contains a unique identifier showing the role of the user such as `CUSTOMER`
          example: 'CUSTOMER'
          enum:
            - CUSTOMER
            - CLIENT_ADMIN
            - SUPPORT_SPECIALIST
            - OPS_MANAGER
        position:
          type: string
          description: This field contains the position (designation) of the user such as `Employee`
          example: 'Employee'
      required:
        - cardProgramUuid
        - roleName
    AddressModel:
      type: object
      properties:
        addressType:
          type: string
          description: |-
            This field contains the address type. `PRIMARY` address is set during user creation.
          example: 'PRIMARY'
          enum:
            - PRIMARY
            - DELIVERY
        streetAddress:
          type: string
          description: This field contains the street address of the card holder.
        address2:
          type: string
          description: This field contains the second line of address of the card holder.
        cityCode:
          type: string
          description: This field contains the city name of the card holder.
        stateCode:
          type: string
          description: This field contains the state name of the card holder.
        countryCode:
          type: string
          description: This field contains the country code of the card holder.
        postalCode:
          type: string
          description: This field contains the postal code of the card holder.
    ContactModel:
      type: object
      properties:
        contactType:
          type: string
          description: This field contains the contact type
          example: 'EMAIL'
          enum:
            - PHONE
            - WHATSAPP
            - EMAIL
        contactValue:
          type: string
          description: This field contains the contact value of the card holder.
          example: '+971123456789, john.smit@simplifipay.com'
    UserModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is a system-generated unique identifier of the user.
          example: 'f242acc1-bcbf-11eb-8529-c070bc3a2323'
        username:
          type: string
          description: This is a unique identifier of the user in the system.
          example: 'johnsmith'
        firstName:
          type: string
          description: This is the first name of the user.
          example: 'John'
        middleName:
          type: string
          description: This is the middle name of the user.
          example: 'M'
        lastName:
          type: string
          description: This is the last name of the user.
          example: 'Smith'
        gender:
          type: string
          description: This is the gender of the user.
          example: 'MALE'
          enum:
            - MALE
            - FEMALE
        userStatus:
          type: string
          description: This is the current status of the card holder within the SimpliFi system
          example: 'ACTIVE'
          enum:
            - ACTIVE
            - INACTIVE
        kycStatus:
          type: string
          description: This is the current status of the KYC of this card holder.
          example: 'READY_FOR_KYC'
          enum:
            - NOT_SUBMITTED
            - READY_FOR_KYC
            - APPROVED
            - REJECTED
        createdAt:
          type: string
          format: date-time
          description: |-
            This field contains the date and time when the user was created in the SimpliFi system.
          example: 'yyyy-MM-dd HH:mm:ss'
        createdBy:
          type: string
          description: This field contains the UUID of the user who created this user in the SimpliFi system.
          example: 'a49d6f6e-c98b-47db-9d6f-6ec98b77dbf9'
        userDetail:
          $ref: '#/components/schemas/UserDetailModel'
        address:
          $ref: '#/components/schemas/AddressModel'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactModel'

    CardRequestModel:
      type: object
      properties:
        userUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the user
            that was created using the Create User API.
          example: 'f5ba1741-983f-4f51-8375-701461c5bacc'
        cardProgramUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the card program
            that was created using the Create Card Program API.
          example: '56db03b7-29ef-46e3-82ad-68b94abb051f'
        customerTitle:
          type: string
          description: |-
            This is a specific name for the card holder to be displayed on the card in addition
            to the cardholder name. This field adds another layer of individuality and exclusivity
            for the card holder. Also known as 4th line embossing.
          example: 'Founding Member'
        instrument:
          $ref: '#/components/schemas/InstrumentType'
      required:
        - userUuid
    CardResponseModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is a system-generated unique identifier of the card issued.
          example: '8105fb1b-852c-4d93-88eb-2fb2361d4b45'
        userUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the user
            that was created using the Create User API.
          example: '7ace3a56-3cb1-44db-a81d-2735e54c7c15'
        traceUuid:
          type: string
          description: This field contains a unique identifier for the request.
          example: '1a59bec7-8f64-4e11-a3d7-fc9f2ca01c87'
        companyUuid:
          type: string
          description: This field contains a unique identifier of the company for which the card has been configured.
          example: '10cdeb1d-c3af-4288-b770-5d7620171f37'
        cardProgramUuid:
          type: string
          description: |-
            This is a system-generated unique identifier for the card program
            that was created using the Create Card Program API.
          example: 'dfb04381-3a10-4185-9ed3-5a97f43dd1a2'
        instrument:
          $ref: '#/components/schemas/InstrumentType'
        creationDate:
          type: string
          format: date-time
          description: This field contains the date on which the card was created.
          example: 'yyyy-MM-dd HH:mm:ss'
        cardStatus:
          type: string
          description: This field contains the current status of the card.
          example: 'ISSUED'
          enum:
            - PENDING
            - ISSUED
            - ACTIVATED
            - DISABLED
            - LOCKED
            - REPLACED
            - REJECTED
            - EXPIRED
        expiryDate:
          type: string
          description: This field contains the expiry date of the card.
          example: 'MM/dd'
        maskedPan:
          type: string
          description: |-
            This field contains the partially hidden Primary Account Number
            i.e. all digits are masked, except for the last four ones.
          example: '**********1234'
        cardMode:
          type: string
          description: This field contains the mode of the card.
          example: 'PRIMARY'
          enum:
            - PRIMARY
            - SECONDARY
        currency:
          type: string
          description: This field contains the Primary currency of Card
          example: 'USD'
        customerTitle:
          type: string
          description: This field contains the fourth line embossing of the card.
          example: 'Founding Member'
        physicalCardUuid:
          type: string
          description: This is a system-generated unique identifier of the PHYSICAL card issued.
          example: 'a1f65835-be50-450c-a197-8676aa4565d0'
        linkedVirtualCardUuid:
          type: string
          description: This is a system-generated unique identifier of the linked VIRTUAL card.
          example: '86d3111d-6d55-45e0-91c1-32c1397f39ab'
    CardRenewalModel:
      type: object
      properties:
        originalCardUuid:
          type: string
          description: This is a system-generated unique identifier of the card being renewed.
        renewedCardUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the renewed card
            that is issued in place of the original card.
    InstrumentType:
      type: string
      description: This field specifies the type of card that is being issued.
      example: 'VIRTUAL'
      enum:
        - VIRTUAL
        - PHYSICAL
        - VIRTUAL_AND_PHYSICAL
    AmountModel:
      type: object
      properties:
        amount:
          type: number
          format: decimal
          description: This field contains the balance amount available for the card.
          example: '1234.56'
        currency:
          type: string
          description: This field contains the currency of Card
          example: 'AED'
    CardStatusModel:
      type: object
      properties:
        status:
          type: string
          description: This field contains the status of the card.
          example: 'LOCKED'
          enum:
            - LOCKED
            - DISABLED
            - ACTIVATED
        reason:
          type: string
          description: This field specifies the reason for changing the card status.
          example: 'STOLEN'
          enum:
            - ALL_GOOD
            - STOLEN
            - LOST
            - FRAUDULENCE
            - SECURITY_VIOLATION
            - RESTRICTED
            - VOIDED
    CardAmountModel:
      type: object
      properties:
        requestedAmount:
          type: number
          format: decimal
          description: This field contains the amount that has been requested to be loaded onto a card.
          example: '100.00'
        comments:
          type: string
          description: Comments related to the load request

security:
  - bearerAuth: []
