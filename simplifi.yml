openapi: 3.1.0
info:
  title: SimpliFi
  description: |-
    Welcome to SimpliFi platform! We are excited that you have taken the time to understand
    how the SimpliFi platform works, so let's start by going through some of the basic
    concepts of data types, API and Webhook structure and default parameters, etc.
  termsOfService: https://simplifipay.com/terms-and-conditions/
  contact:
    email: support@simplifipay.com
  version: 5.0.0
externalDocs:
  description: Find out more about SimpliFi
  url: https://simplifipay.com/
servers:
  - url: https://{env}-lb.simplifipay.com/
tags:
  - name: auth
    description: |-
      The Auth API Group is designed to authorize you to start using the SimpliFi platform.
      This group has the Login endpoint that allows you to enter into our system. Moreover,
      the endpoint’s response provides you with the access token, which would be used in
      making further API calls.
  - name: card-program
    description: |-
      The Card Program API Group is designed to manage common features among cards, by
      grouping them under a card program. The SimpliFi platform would create a bespoke
      card program template based on your requirements such as the scheme, validity of
      the cards, form factor of the cards, authorization controls, velocity controls etc.
      You would be able to create a card program using this template. 

      Every card issued under a card program inherits the characteristics of that card
      program. Card program templates are shared separately and if you don’t have them
      already, click on [this link](https://simplifipay.com/).
  - name: funding-source
    description: |-
      The Funding Source API Group is designed to add and manage the funding sources
      under a Company. Funding source is the equivalent of an unique account where all
      the funds related to this funding source are pooled. Each card program should be
      linked with a funding source so that funds from the funding source could be used
      to load cards issued under this Card program. A Funding source will have funds
      in one currency only and to hold funds in multiple currencies multiple funding
      sources would have to be created and assigned to a Company.

      Funding source information would be shared with SimpliFi's clients separately
      and if you don't have them already, click on [this link](https://simplifipay.com/).
  - name: document
    description: |-
      The Document API Group is designed to allow users to handle documents of the
      SimpliFi system which are simply referred to as `Documents`.
  - name: user
    description: |-
      The User API Group is designed to manage the users (card holders). It is mandatory
      that the cardholders should only be created under a card program. Card holder
      creation could be a one or two step process:

      - Capture user (card holders) details
      - Conduct user (card holders) KYC (if required by the regulators)

      Requirements related to what user details need to be captured and the kind of KYC
      required are defined during client onboarding as mandated by the issuing bank and
      regulations, depending on the jurisdiction and the nature of the card program. 

      Following endpoints cover all the aspects of creating and maintaining
      users (card holders).
  - name: card
    description: |-
      The Cards API Group is designed to manage all the activities related to the cards
      life cycle. Cards can either be issued in physical or virtual form, or both. Cards
      would inherit the default characteristics of the card program under which they have
      been issued, however, some of these can be changed at the card level. Cards could
      be issued only to a registered user (card holder) within a card program.
  - name: transaction
    description: |-
      The Transactions API Group is designed to allow you to have control over the listing of transactions
      that have been processed on a card. These endpoints enable you to get insights of different
      transactions being carried upon certain cards.
paths:
  /v1/auth/login/{companyName}:
    post:
      tags:
       - auth
      summary: Login to generate JWT token
      description: |-
        The Login endpoint allows you to login to the SimpliFi platform using the provided
        credentials. If you don't have the credentials already, you can request them through
        [this link](https://simplifipay.com/). The endpoint returns an access token to be
        used in making further API calls. Following are the properties of this endpoint.
      parameters:
        - name: companyName
          in: path
          description: |-
            This is an internal identifier of your company in the SimpliFi platform. We will
            generate the company name for you and share it. If you don't have it already,
            you can request it through [this link](https://simplifipay.com/).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthRequestModel'
      responses:
        200:
          description: On successful operation JWT token is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseModel'

  /v1/card-program:
    post:
      tags:
        - card-program
      security:
        - bearerAuth: [ ]
      summary: Create Card Program
      description: |-
        The Create Card Program endpoint allows API users to create a new card program
        to be associated with cards of the SimpliFi platform.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardProgramRequestModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardProgramRequestModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/card-program/{uuid}:
    get:
      tags:
        - card-program
      security:
        - bearerAuth: [ ]
      summary: Get Card Program
      description: |-
        The Get Card Program endpoint retrieves details about a card program.
        Following are the properties of this endpoint.
      parameters:
        - name: uuid
          in: path
          description: |-
            This is a unique identifier for the program that was created using the Create Card Program API.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardProgramResponseModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/card-program/{uuid}/status:
    patch:
      tags:
        - card-program
      security:
        - bearerAuth: [ ]
      summary: Change Card Program Status
      description: |-
        The Change Card Program Status endpoint changes the status of a card program. This endpoint is helpful
        when a card program is to be suspended or activated as per the business needs. Following are the
        properties of this endpoint.
      parameters:
        - name: uuid
          in: path
          description: |-
            This is a unique identifier for the program that was created using the Create Card Program API.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardProgramStatusChangeRequestModel'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v2/card-program/{uuid}/funding-source:
    post:
      tags:
        - card-program
        - funding-source
      security:
        - bearerAuth: [ ]
      summary: Link Funding Source to Card Program
      description: |-
        The Link Funding Source to Card Program endpoint links a funding source to a card program.
        The funding source works as an account that would be used to fund all its cards under this
        Card Program. Following are the properties of this endpoint.
      parameters:
        - name: uuid
          in: path
          description: |-
            This is a unique identifier for the program that was created using the Create Card Program API.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundingSourceRequestModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingSourceResponseModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/card-program/{uuid}/funding-source-balance:
    get:
      tags:
        - card-program
        - funding-source
      security:
        - bearerAuth: [ ]
      summary: Get Balance of Funding Source
      description: |-
        The Get Balance of Funding Source endpoint retrieves the remaining balance of a funding source.
        Following are the properties of this endpoint.
      parameters:
        - name: uuid
          in: path
          description: |-
            This is a unique identifier for the program that was created using the Create Card Program API.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingSourceBalanceModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/card-program/transfer-fund:
    post:
      tags:
        - card-program
      security:
        - bearerAuth: [ ]
      summary: Transfer funds from one Card Program to other
      description: |-
        The Transfer Fund endpoint allows API users to transfer funds from a one
        Card Program to other Card Program. Following are the properties of this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardProgramTransferFundsModel'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/card-program/raise-funding:
    post:
      tags:
        - card-program
        - funding-source
      security:
        - bearerAuth: [ ]
      summary: Raise Funding
      description: |-
        The Raise Funding endpoint helps in adding or removing funds from a funding source. This API doesn't
        actually move the money between accounts but should be used so that the proof of funds is shared with
        the Issuer/Processor Bank. After the proof of funds attachment is verified by the Issuer/Processor
        funds would reflect in the respective funding source. Following are the properties of this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaiseFundingRequestModel'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/document/upload:
    post:
      tags:
        - card-program
        - document
      security:
        - bearerAuth: [ ]
      summary: Raise Funding Document Upload
      description: |-
        This API should be called before calling Raise Funding API to attach `Proof of funds / Confirmation of
        funds transfer from the Bank` document (PNG, JPEG, PDF are allowed formats) and the string value returned
        in the `fileUrl` field of the response should be used in Raise Funding API's attachment parameter.

        Note: After the funds are transferred from the whitelisted Bank account to the Issuer/Processor Bank
        account, the confirmation of transfer of funds screenshot/image/PDF should be used as an attachment.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RaiseFundingDocumentModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/document:
    post:
      tags:
        - user
        - document
      security:
        - bearerAuth: [ ]
      summary: Upload Document
      description: |-
        The Upload Document endpoint uploads the user documents to the SimpliFi system which are required
        as part of the sanctions screening or KYC process. The documents can be uploaded in one of the
        following formats (.jpg, .jpeg, .png, .pdf)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/statement:
    get:
      tags:
        - card-program
        - funding-source
        - transaction
      security:
        - bearerAuth: [ ]
      summary: Funding Source Statement
      description: Get funding source statement based on date range.
      parameters:
        - name: accountId
          in: query
          description: The account ID of the processor mapping (wallet).
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          description: start date of date-range
          schema:
            type: string
        - name: endDate
          in: query
          description: end date date of date-range
          schema:
            type: string
        - name: sortBy
          in: query
          description: sort statement column value
          schema:
            type: string
        - name: sortDir
          in: query
          description: sort direction
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/statement/card/{uuid}:
    get:
      tags:
        - card
        - transaction
      security:
        - bearerAuth: [ ]
      summary: Get Card Statement
      description: Get card statement based on date range.
      parameters:
        - name: startDate
          in: query
          description: start date of date-range
          schema:
            type: string
        - name: endDate
          in: query
          description: end date date of date-range
          schema:
            type: string
        - name: sortBy
          in: query
          description: sort statement column value
          schema:
            type: string
        - name: sortDir
          in: query
          description: sort direction
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardStatementResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/transaction:
    post:
      tags:
        - transaction
      security:
        - bearerAuth: [ ]
      summary: List All Transactions
      description: |-
        The List All Transactions endpoint retrieves a paginated array of all the transactions carried
        out in the last 90 days. The results are displayed with a default page size of 10 and the response
        returns the transaction list with total no. of elements. Following are the properties of this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequestModel'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/user:
    get:
      tags:
        - user
      security:
        - bearerAuth: [ ]
      summary: List all Users
      description: |-
        The List all Users endpoint retrieves all the existing users, grouped under a company.
        Following are the properties of this endpoint.
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
          description: |-
            Represents the start date of the user's registration with the SimpliFi system. Note All the
            dates in the SimpliFi system are stored and displayed in the following format `yyyy-mm-dd hh:mm:ss`
          required: false
        - name: endDate
          in: query
          schema:
            type: string
          description: |-
            Represents the end date of the user's registration with the SimpliFi system. Note All the
            dates in the SimpliFi system are stored and displayed in the following format `yyyy-mm-dd hh:mm:ss`
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - user
      security:
        - bearerAuth: [ ]
      summary: Create a User
      description: |-
        The Create a User endpoint creates a new user. In the SimpliFi platform, it is mandatory
        for the user to be a part of a card program instead of being a standalone entity.
        Following are the properties of this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRequestModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/user/{uuid}:
    get:
      tags:
        - user
      security:
        - bearerAuth: [ ]
      summary: Retrieve a User
      description: |-
        The Retrieve a User endpoint retrieves details about an existing user.
        Following are the properties of this endpoint.
      parameters:
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the user.
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
    put:
      tags:
        - user
      security:
        - bearerAuth: [ ]
      summary: Update a User
      description: |-
        The Update a User endpoint updates the details of an existing user.
        Following are the properties of this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRequestModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
    delete:
      tags:
        - user
      security:
        - bearerAuth: [ ]
      summary: Delete a User
      description: |-
        The Delete a User endpoint deletes an existing user. Deleting a user does not erase data from the
        system but only deactivates the user and its associated cards.
        Following are the properties of this endpoint.
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'

  /v1/card:
    post:
      tags:
        - card
      security:
        - bearerAuth: [ ]
      summary: Create a Card
      description: |-
        The Create a Card endpoint creates/issues a card to a user under a Card Program. The card issued
        using this endpoint would inherit the characteristics defined in its card program such as
        authorization controls, velocity controls etc. Following are the properties of this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRequestModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponseModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/card/{uuid}:
    get:
      tags:
        - card
      security:
        - bearerAuth: [ ]
      summary: Get Card Details
      description: |-
        The Get Card Details endpoint retrieves all the details of a specific card.
        Following are the properties of this endpoint.
      parameters:
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the card.
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponseModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/card/{uuid}/balance-inquiry:
    get:
      tags:
        - card
      security:
        - bearerAuth: [ ]
      summary: Retrieve Balance on the Card
      description: |-
        The Retrieve Balance on the Card endpoint retrieves the remaining balance of a card.
        Following are the properties of this endpoint.
      parameters:
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the card.
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmountModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/card/{uuid}/activate:
    post:
      tags:
        - card
      security:
        - bearerAuth: [ ]
      summary: Activate a Card
      description: |-
        The Activate a Card endpoint activates an issued/created card.
        Following are the properties of this endpoint.
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/card/{uuid}/status:
    post:
      tags:
        - card
      security:
        - bearerAuth: [ ]
      summary: Manage Card Status
      description: |-
        The Manage Card Status endpoint manages the status of a card. This endpoint is helpful as
        cards can be locked (temporarily suspended), disabled, reissued depending upon the
        business requirements. Following are the properties of this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardStatusModel'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/card/{uuid}/load:
    post:
      tags:
        - card
      security:
        - bearerAuth: [ ]
      summary: Load a Card
      description: |-
        The Load a Card endpoint adds funds to an active card.
        Following are the properties of this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardAmountModel'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/card/{uuid}/unload:
    post:
      tags:
        - card
      security:
        - bearerAuth: [ ]
      summary: Unload a Card
      description: |-
        The Unload a Card endpoint removes funds from an active card and moves them back to the Funding
        source (Virtual account that holds the funds in certain currency).
        Following are the properties of this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardAmountModel'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/card/{uuid}/renew:
    post:
      tags:
        - card
      security:
        - bearerAuth: [ ]
      summary: Renewal of the Card
      description: |-
        The Renewal of the Card endpoint renews an expired, lost, or stolen card. In this case, a new
        Primary Account Number (PAN) would be issued from the prevalent settings of the relevant card program.
        Following are the properties of this endpoint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardRenewalModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/card/{uuid}/card-type:
    post:
      tags:
        - card
      security:
        - bearerAuth: [ ]
      summary: Request a Physical Card
      description: |-
        The Request a Physical Card endpoint issues a Physical card against the Card UUID of the activated
        virtual card. Note (this endpoint is specific to physical cards and cannot be used for virtual cards.
        Physical cards should be issued only for a virtual card in `ACTIVE` status).
        Following are the properties of this endpoint.
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    EntityNotFoundError:
      description: Entity not found with the specified UUID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'

  schemas:
    ErrorModel:
      type: object
      properties:
        errorCode:
          type: integer
          description: A 5-7 digit number defining the error
          example: '99997'
        message:
          type: string
          description: A brief message defining the error
          example: 'General Error'
    AuthRequestModel:
      type: object
      properties:
        client_id:
          type: string
          description: |-
            The values of this enumeration identify your channel for calling the endpoint.
            Example: If you want to generate the access token to call subsequent APIs from
            your back-end system then use the value simplifi-api-client. Allowed values
            are: `simplifi-ios-client`, `simplifi-android-client`, and `simplifi-api-client`.
        client_secret:
          type: string
          description: |-
            This is a secret identification pattern assigned to you by the SimpliFi platform.
            For each allowed value of “client_id” there is a respective client secret value
            shared with you before the start of the integration. Pass the respective value here.
            If you don't have it already, you can request it through [this link](https://simplifipay.com/).
        grant_type:
          type: string
          description: |-
            You need to pass this value to log in through the Client Secret shared by SimpliFi.
            Allowed value is `client_credentials`. If you don't already have these credentials,
            you can request them through [this link](https://simplifipay.com/).
      required:
        - client_id
        - client_secret
        - grant_type
    AuthResponseModel:
      type: object
      properties:
        access_token:
          type: string
          description: |-
            This is the system-generated access token to be used for subsequent calls of the
            same session. It is to be sent as an authorization header along with the
            system-generated token type.
        expires_in:
          type: string
          description: |-
            This is the expiry date/time that defines the validity of the access token.
            Note (one needs to re-login before this expiration time).
        token_type:
          type: string
          description: |-
            This field contains the token type which is coupled with access token to form
            an authorization header. Accepted value is `bearer`.

    CardProgramRequestModel:
      type: object
      properties:
        uuid:
          type: string
          description: |-
            This is a system-generated unique identifier for the card program that was created by this endpoint.
          example: '68de4d4a-20ed-48c6-8594-dc74e1730cb7'
        name:
          type: string
          description: |-
            This is a custom name for the card program. We recommend choosing a unique name to identify the
            card programs that are created under your company.
          example: 'Marketing Budget'
        cardProgramTemplateUuid:
          type: string
          description: |-
            This is a unique identifier that represents a specific card program template. A Card Program
            Template contains all the features applicable on a card that would be issued under a card program.
            This information is shared by SimpliFi separately. If you don’t have them already, click
            on [this link](https://simplifipay.com/).
          example: '36fad307-416e-4333-920a-b07fba57a658'
        feesOperationEnabled:
          type: boolean
          default: false
          description: This field checks if fee operation is enabled or not.
          example: 'true'
        config:
          $ref: '#/components/schemas/CardConfigModel'
      required:
        - name
        - cardProgramTemplateUuid
        - config
    CardConfigModel:
      type: object
      description: |-
        This object is a collection of configuration fields including both Point of Interest and Velocity
        Control fields. It contains sub-fields explained in the rows below.
      properties:
        poi:
          $ref: '#/components/schemas/CardPoi'
        velocityControls:
          $ref: '#/components/schemas/VelocityControlConfigModel'
        merchantControls:
          $ref: '#/components/schemas/MerchantDetailModel'
      required:
        - poi
        - velocityControls
        - merchantControls
    CardPoi:
      type: object
      description: |-
        This object is a collection of Point of Interest configuration fields showing where the card
        issued under this card program can be used. It contains sub-fields explained in the rows below.
      properties:
        ecommerce:
          type: boolean
          description: |-
            This field, if enabled, allows online transactions.
            The allowed values are `true` and `false`.
          example: 'true'
        atm:
          type: boolean
          description: |-
            This field, if enabled, allows Automated Teller Machine (ATM) transactions.
            The allowed values are `true` and `false`.
          example: 'true'
        pos:
          type: boolean
          description: |-
            This field, if enabled, allows Point of Sale (POS) transactions.
            The allowed values are `true` and `false`.
          example: 'true'
        international:
          type: boolean
          description: |-
            This field, if enabled, allows International transactions.
            The allowed values are `true` and `false`.
          example: 'true'
        contactless:
          type: boolean
          description: |-
            This field, if enabled, allows contactless (RFID, Bluetooth, NFC, etc) transactions.
            The allowed values are `true` and `false`.
          example: 'true'
        dcc:
          type: boolean
          description: |-
            This field, if enabled, allows Dynamic Currency Conversion (DCC) transactions.
            The allowed values are `true` and `false`.
          example: 'true'
    VelocityControlConfigModel:
      type: object
      description: |-
        This object is a collection of velocity control fields that defines the frequency of card's usage,
        issued under this card program. It contains sub-fields explained in the rows below.
      properties:
        activeVelocityAdapterKey:
          type: string
          description: |-
            This is a key for a velocity control group that you want to activate for your card program.
            A velocity control group contains multiple combinations of card's usage frequency (For example,
            your daily withdrawal limits at the ATMs). A velocity control key is mapped to each velocity
            control group that is configured at SimpliFi's backend. Note (this value gets set as the default
            key for the cards issued once this Card Program is created). The applicable values are shared by
            SimpliFi separately. If you don’t have them already, click on [this link](https://simplifipay.com/).
          example: 'SPF-VL-002'
        velocityControlList:
          type: array
          items:
            $ref: '#/components/schemas/VelocityControlDetailConfigModel'
    VelocityControlDetailConfigModel:
      type: object
      description: |-
        This array of objects lists the available velocity adapter keys, from which the active velocity
        adapter key is chosen. It contains the subfields explained in the rows below. Velocity control
        key list are shared by SimpliFi separately. If you don’t have them already, click
        on [this link](https://simplifipay.com/).
      properties:
        velocityAdapterKey:
          type: string
          description: |-
            This field contains the key to identify velocity control at the processor. A velocity control
            group contains multiple combinations of card’s usage frequency (For example, your daily
            withdrawal limits at the ATMs). A velocity control key is mapped to each velocity control group
            that is configured at SimpliFi’s backend. Note (this value gets set as the default key for the
            cards issued once this Card Program is created). The applicable values will be shared by SimpliFi
            separately. If you don’t have them already, click on [this link](https://simplifipay.com/).
          example: '201'
        name:
          type: string
          description: |-
            This is the name of the velocity control group. We recommend using unique and identifiable names.
          example: 'Velocity 201'
    MerchantDetailModel:
      type: object
      description: |-
        This object is a collection of merchant control fields. These are customizable controls over the
        top of pre-configured ones. For example, restriction over certain types of merchants such as drugs 
        nd gambling merchants etc. It contains sub-fields explained in the rows below.
      properties:
        whiteList:
          $ref: '#/components/schemas/MerchantListModel'
        blackList:
          $ref: '#/components/schemas/MerchantListModel'
    MerchantListModel:
      type: object
      description: |-
        This object lists the merchant IDs (MIDs) and MCCs that are to be whitelisted/blacklisted. Any card
        issued under this card program will work at all the merchants whitelisted and will not work at all
        the merchants blacklisted.
      properties:
        name:
          type: string
          description: |-
            The name that is to be assigned to identify the group of merchant IDs (MIDs)
            and MCCs to be whitelisted/blacklisted.
          example: 'whitelist'
        merchants:
          type: array
          description: |-
            This array of objects is a collection of merchant IDs (MIDs) and MCCs that are to be
            whitelisted/blacklisted. It contains sub-fields explained in the rows below.
          items:
            $ref: '#/components/schemas/MerchantModel'
    MerchantModel:
      type: object
      properties:
        mid:
          type: string
          description: |-
            This field contains the list of merchant IDs (MIDs) and MCCs to be whitelisted/blacklisted.
          example: '1234'
    CardProgramResponseModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is the unique identifier for the card program to which the card program belongs.
          example: '2143c065-a8af-4fd7-a839-17371f760e03'
        name:
          type: string
          description: This is the name of the card program.
          example: 'Marketing Budget'
        companyUuid:
          type: string
          description: This is the unique identifier for the company to which the card program belongs.
          example: '306182e4-c3e9-41d6-9184-de5bfec1fad1'
        parentAccountId:
          type: string
          description: Account ID associated with funding source
          example: '1234567'
        productId:
          type: string
          description: Product ID associated with processor mapping
          example: '0031'
        fundingSourceUuid:
          type: string
          description: This is a unique identifier of the funding source linked to this card program.
          example: '86bada5e-d67f-4efb-975f-4a20b86a5b13'
        cardProgramStatus:
          type: string
          description: This field specifies the status of the card program.
          example: 'ACTIVE'
          enum:
            - CREATED
            - ACTIVE
            - INACTIVE
            - SUSPENDED
            - DEFAULT
        config:
          $ref: '#/components/schemas/CardConfigModel'
        cardProgramTemplateUuid:
          type: string
          description: This field contains the unique identifier of the card program template of this card program.
          example: 'b13dc7ac-163b-49d1-b9e9-98ed7b73cccf'
        walletThreshold:
          type: number
          format: decimal
          description: load threshold
          example: '100'
        autoLoadAmount:
          type: number
          format: decimal
          description: auto load amount
          example: '100'
        currency:
          type: string
          description: This field contains the currency of the card program.
          example: 'AED'
        feesOperationEnabled:
          type: boolean
          description: This field checks if fee operation is enabled or not.
          example: 'true'
          default: false
    FundingSourceBalanceModel:
      type: object
      properties:
        amount:
          type: number
          format: decimal
          description: Amount to be transferred.
          example: '100.50'
        currency:
          type: string
          description: This field contains the balance amount of the funding source.
          example: 'AED'

    CardProgramTransferFundsModel:
      type: object
      properties:
        sourceCardProgramUuid:
          type: string
          description: |-
            Source Card program UUID from where funds is being transferred from.
          example: '381ad98a-16bd-4de1-9fe3-b30683ece550'
        destCardProgramUuid:
          type: string
          description: |-
            Destination Card program UUID from where funds is being transferred to.
          example: 'b9166cc8-cb84-4dd4-a728-56e2860ddf1a'
        amount:
          type: number
          format: decimal
          description: Amount to be transferred.
          example: '100.50'

    FundingSourceRequestModel:
      type: object
      properties:
        fundingSource:
          type: string
          description: |-
            This field contains a token that identifies the funding source that is to be linked with
            the card program. This information will be shared separately. If you don’t have them
            already, click on [this link](https://simplifipay.com/).
          example: '1234567'
      required:
        - fundingSource
    FundingSourceResponseModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is a system-generated unique identifier for the funding source that was created.
          example: '84caba0c-275a-474c-b6f6-567a6a76b636'
        cardProgramUuid:
          type: string
          description: |-
            This field contains the system generated unique identifier for the program
            that was created using the Create Card Program API.
          example: 'e283c96c-01e6-4afb-9b38-b4d2622e0a57'
        fundingSource:
          type: string
          description: |-
            This field contains a token that identifies the funding source that is to be linked with the card program.
          example: '1234567'
        currency:
          type: string
          description: Currency of card program.
          example: 'USD'

    CardProgramStatusChangeRequestModel:
      type: object
      properties:
        cardProgramStatus:
          type: string
          description: This field specifies the status (ACTIVE, SUSPENDED, INACTIVE) of the Card Program.
          example: 'SUSPENDED'
          enum:
            - ACTIVE
            - SUSPENDED
            - INACTIVE

    RaiseFundingRequestModel:
      type: object
      properties:
        cardProgramUuid:
          type: string
          description: |-
            This field contains the system generated unique identifier for the program
            that was created using the Create Card Program API.
          example: 'c83d26ed-f093-4e43-b81b-35884f068d4b'
        amount:
          type: number
          format: decimal
          description: This field contains the amount that has been requested for fund transfer.
          example: '10000.00'
        sourceFunds:
          type: string
          description: This field contains the source of funds. Allowed value `OTHER`.
          example: 'OTHER'
          enum:
            - OTHER
            - TRADING_ACTIVITIES
            - RETAINED_PROFITS
            - INVESTMENT

    StatementResponse:
      type: object
      properties:
        companyName:
          type: string
          description: Name of the company.
          example: 'SimpliFi'
        statementDate:
          type: string
          format: date
          description: The date on which the statement is created.
          example: 'yyyy-MM-dd'
        accountId:
          type: string
          description: The account ID of wallet.
          example: '885180123'
        currency:
          type: string
          description: The currency in which the amounts are transacted.
          example: 'USD'
        startDate:
          type: string
          format: date-time
          description: The start date of the date range.
          example: 'yyyy-MM-dd HH:mm:ss'
        endDate:
          type: string
          format: date-time
          description: The end date of the date range.
          example: 'yyyy-MM-dd HH:mm:ss'
        openingBalance:
          type: number
          format: decimal
          description: The opening balance on the account from the start date of the date range.
          example: '6.95'
        closingBalance:
          type: number
          format: decimal
          description: The closing balance on the account till the end date of the date range.
          example: '6.95'
        transactions:
          type: array
          description: The array of transactions.
          items:
            $ref: '#/components/schemas/StatementResponseDetails'
    CardStatementResponse:
      type: object
      properties:
        companyName:
          type: string
          description: Name of the company.
          example: 'SimpliFi'
        statementDate:
          type: string
          format: date
          description: The date on which the statement is created.
          example: 'yyyy-MM-dd'
        maskPan:
          type: string
          description: The Masked PAN of card.
          example: '************2737'
        currency:
          type: string
          description: The currency of the card.
          example: 'AED'
        startDate:
          type: string
          format: date-time
          description: The start date of the date range.
          example: 'yyyy-MM-dd HH:mm:ss'
        endDate:
          type: string
          format: date-time
          description: The end date of the date range.
          example: 'yyyy-MM-dd HH:mm:ss'
        openingBalance:
          type: number
          format: decimal
          description: The opening balance of the card from the start date of the date range.
          example: '6.95'
        currentBalance:
          type: number
          format: decimal
          description: The current balance of the card
          example: '6.95'
        settledBalance:
          type: number
          format: decimal
          description: The settled balance of the card
          example: '6.95'
        unsettledBalance:
          type: number
          format: decimal
          description: The unsettled balance of the card
          example: '6.95'
        blockedAmount:
          type: number
          format: decimal
          description: The blocked amount of the card
          example: '6.95'
        totals:
          type: object
          additionalProperties:
            type: number
            format: decimal
        transactions:
          type: array
          description: The array of transactions.
          items:
            $ref: '#/components/schemas/TransactionResponseDetails'
    StatementResponseDetails:
      type: object
      properties:
        fundRequestUuid:
          type: string
          description: This is a unique identifier of the fund request.
          example: '11e082c2-993d-4026-82c4-1234ec464796'
        transactionId:
          type: string
          description: The transaction ID.
          example: '6615206'
        transactionDate:
          type: string
          format: date-time
          description: The date on which the transaction was carried out.
          example: 'yyyy-MM-dd HH:mm:ss'
        amount:
          type: number
          format: decimal
          description: The fund amount.
          example: '6.95'
        fundRequestType:
          type: string
          description: The type for fund request.
          example: 'LOAD'
          enum:
            - LOAD
            - UNLOAD
        fundRequestCategory:
          type: string
          description: The category for fund request.
          example: 'RAISE_FUNDING'
          enum:
            - RAISE_FUNDING
            - FUND_TRANSFER
            - CARD_LOAD
            - CARD_UNLOAD
        previousBalance:
          type: number
          format: decimal
          description: The balance on the account before this transaction.
          example: '6.95'
        currentBalance:
          type: number
          format: decimal
          description: The current balance on the account.
          example: '6.95'
        maskPan:
          type: string
          description: The mask pan of the transaction.
          example: '************2737'
        userName:
          type: string
          description: The username of the user of this transaction.
          example: 'john.smith@simplifipay.com'
        userFullName:
          type: string
          description: The full name of the user of this transaction.
          example: 'John Smith'
        userUuid:
          type: string
          description: The UUID of the user of this transaction.
          example: '1b2dbfc7-3432-4eb8-9367-fb123dcf2ba0'
        srcCurrency:
          type: string
          description: Source currency
          example: 'USD'
        destCurrency:
          type: string
          description: Destination currency
          example: 'USD'
    TransactionRequestModel:
      type: object
      properties:
        cardProgramUuids:
          type: array
          description: These are unique identifiers of the card programs.
          items:
            type: string
        page:
          description: This field contains the page number currently being displayed for transactions.
          type: integer
        size:
          description: This field contains the number of the transaction records to be displayed on this page.
          type: integer
        startDate:
          description: This is the start date of transactions.
          type: string
        endDate:
          description: This is the end date of transactions.
          type: string
        cardUuid:
          description: This is a unique identifier of the card.
          type: string
        userUuid:
          description: This is a unique identifier of the card holder.
          type: string
        billAmount:
          description: This field contains the billed amount.
          type: number
        billCurrency:
          description: This field contains the currency in which the amount has been billed.
          type: string
        sortBy:
          type: string
          enum:
            - transactionDate
            - transactionAmount
        sortDirection:
          type: string
          enum:
            - ASC
            - DESC
        transactionType:
          type: array
          description: |-
            This field defines the Transaction types. Allowed values are
            `Auth` - for Authorized transactions
            `Reversal` - for Reversed transactions
            `Settlement` - for Settled transactions
            `Refund` - for Refund transactions
            `Load` - for Card Load transactions
            `Unload` - for Card Unload transactions
            `Fees` - for Fee transactions
          enum:
            - Auth
            - Reversal
            - Settlement
            - Refund
            - Load
            - Unload
            - Fees
          items:
            type: string
    TransactionResponse:
      type: object
      properties:
        transactions:
          type: array
          description: |-
            This array of objects is a collection of transaction fields,
            possessing sub-fields explained in the rows below.
          items:
            $ref: '#/components/schemas/TransactionResponseDetails'
        totalElement:
          type: integer
          format: int64
          description: |-
            This field contains the total number of elements against the criteria.
    TransactionResponseDetails:
      type: object
      properties:
        transactionUuid:
          type: string
          description: This is a unique identifier of the transaction.
          example: 'f0888e10-43e3-4686-9c79-256633d79559'
        transactionId:
          type: string
          description: This is an identifier of the transaction.
          example: '6712309'
        cardUuid:
          type: string
          description: This is a unique identifier of the card.
          example: '95e8008f-c14b-4d4c-bc3b-6378be83618c'
        maskedPan:
          type: string
          description: Last 4 digits of the card.
          example: '************9999'
        userName:
          type: string
          description: username of card holder.
          example: 'john.smith'
        userEmail:
          type: string
          description: email of card holder.
          example: 'user@simplifipay.com'
        userFullName:
          type: string
          description: full name of card holder.
          example: 'John Smith'
        transactionType:
          type: string
          description: This is a transaction type
          example: 'Auth'
          enum:
            - Auth
            - Reversal
            - Settlement
            - Refund
            - Load
            - Unload
            - Fees
        statusCode:
          type: string
          description: This field contains the status code of the transaction code received from processor.
          example: '00'
        statusCodeDescription:
          type: string
          description: This field contains the status description of the transaction code received from processor.
          example: 'Approved'
        authResponse:
          type: string
          description: This field contains the auth response value of the transaction received from processor.
          example: '51'
        mccCode:
          type: string
          description: |-
            This field contains the Merchant Category Code. These, MCCs are four-digit numbers that
            describe a merchant's primary business activity.
          example: '6011'
        merchantId:
          type: string
          description: This field contains the registered merchant ID.
          example: 'F09089372443345'
        merchantName:
          type: string
          description: This field contains the registered merchant name.
          example: 'GOOGLE *TEMPORARY HOLD'
        transactionAmount:
          type: number
          format: decimal
          description: This field contains the total amount that was transacted.
          example: '100.54'
        transactionCurrency:
          type: string
          description: This field contains the currency in which the amount was transacted.
          example: 'AED'
        transactionDate:
          type: string
          format: date-time
          description: This field contains the date on which the transaction was carried out.
          example: 'yyyy-MM-dd HH:mm:ss'
        billAmount:
          type: number
          format: decimal
          description: This field contains the billed amount.
          example: '6.95'
        billCurrency:
          type: string
          description: This field contains the name of currency in which the amount is stored in the card
          example: 'AED'
        fxFee:
          type: number
          format: decimal
          description: This field contains the FX fee amount.
          example: '0.31'
        feeOperationType:
          type: string
          description: This field specifies the Fee Operation Type
          example: 'PRIMARY_VIRTUAL_CARD_ISSUANCE'
        feeOperationTypeDescription:
          type: string
          description: This field specifies the Fee Operation Type description
          example: 'Virtual Card Issuance Fee'
        comments:
          type: string
          description: Any notes for this transaction

    RaiseFundingDocumentModel:
