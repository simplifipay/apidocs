                  $ref: '#/components/schemas/CardUuidParameter'
                transactionType:
                  $ref: '#/components/schemas/TransactionTypeParameter'
                transactionAmount:
                  type: number
                  format: decimal
                  description: This field contains the total amount that was transacted.
                  example: '100.54'
                transactionCurrency:
                  type: string
                  description: This field contains the currency in which the amount was transacted.
                  example: 'AED'
                billAmount:
                  type: number
                  format: decimal
                  description: This field contains the total amount that was transacted in card's currency.
                  example: '100.54'
                billCurrency:
                  type: string
                  description: This field contains the card's currency.
                  example: 'AED'
                transactionStatusCode:
                  type: string
                  description: One or Two digit status code of the transaction
                  example: '00'
                mccCode:
                  type: string
                  description: This field contains the Merchant Category Code
                  example: 4081
                merchantId:
                  type: string
                  description: This field contains the Merchant ID
                  example: '230198000202156'
                merchantName:
                  type: string
                  description: This field contains the name of the Merchant where the transaction happened
                  example: 'TikTok Ads'
                transactionDate:
                  type: string
