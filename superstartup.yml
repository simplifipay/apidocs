    RaiseFundingWebhook:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          properties:
            eventType:
              type: string
              description: 'RAISE_FUNDING_SOURCE'
              example: 'RAISE_FUNDING_SOURCE'
            eventPayload:
              type: object
              properties:
                fundingRequestUuid:
                  type: string
                  description: This field contains the unique identifier of raise funding
                companyUuid:
                  $ref: '#/components/schemas/CompanyUuidParameter'
                amount:
                  type: number
                  format: decimal
                  description: The amount which has been `LOAD` or `UNLOAD` in this raise funding
                  example: 10000.45
                transactionType:
                  type: string
                  description: This field tells if the transaction is of `LOAD` or `UNLOAD`
                  example: LOAD
                  enum:
                    - CREDIT
                    - UNLOAD
                fundingStatus:
                  type: string
                  description: This field contains the status of the raise funding
                  example: 'APPROVED'
                  enum:
                    - PENDING
                    - ACKNOWLEDGED
                    - APPROVED
                    - REJECTED
                description:
                  type: string
                  description: This field contains any comments related to raise funding
                  example: 'NA'
              required:
                - fundingRequestUuid
                - amount
                - transactionType
                - fundingStatus
          required:
            - eventType
            - eventPayload

    ConsumerAccountProvisionedWebhook:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          properties:
            eventType:
              type: string
              description: 'CONSUMER_ACCOUNT_PROVISIONED'
              example: 'CONSUMER_ACCOUNT_PROVISIONED'
            eventPayload:
              type: object
              description: |-
                Confirms account provisioning is complete. Published once the full internal
                hierarchy required for the account (issuer registration, processor registration,
                processor mapping, funding source, default card program) has been found or created.
              properties:
                accountId:
                  type: string
                  description: This field contains the IBAN of the provisioned account.
                  example: 'AE070331234567890123456'
                companyUuid:
                  $ref: '#/components/schemas/CompanyUuidParameter'
                userUuid:
                  $ref: '#/components/schemas/UserUuidParameter'
                currency:
                  type: string
                  description: This field contains the currency of the provisioned account.
                  example: 'AED'
                processorMappingUuid:
                  $ref: '#/components/schemas/ProcessorMappingUuidParameter'
                defaultCardProgramUuid:
                  type: string
                  description: This field contains the unique identifier of the default card program assigned to the account.
                  example: 'c1a2e3f4-5b6c-47d8-9e0f-1a2b3c4d5e6f'
                status:
                  type: string
                  description: This field contains the status of the account provisioning request.
                  example: 'SUCCESS'
                failureCode:
                  type: string
                  description: This field contains the failure code when provisioning did not succeed.
              required:
                - accountId
                - companyUuid
                - userUuid
                - status
          required:
            - eventType
            - eventPayload

