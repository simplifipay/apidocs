openapi: 3.1.0
info:
  title: SimpliFi
  description: |-
    Welcome to SimpliFi platform! We are excited that you have taken the time to understand
    how the SimpliFi platform works, so let's start by going through some of the basic
    concepts of data types, API and Webhook structure and default parameters, etc.
  termsOfService: https://simplifipay.com/terms-and-conditions/
  contact:
    email: support@simplifipay.com
  version: 5.x.x
externalDocs:
  description: Find out more about SimpliFi
  url: https://simplifipay.com/
servers:
  - url: https://{env}-lb.simplifipay.com
tags:
  - name: 'Auth'
    description: |-
      The Auth API Group is designed to authorize you to start using the SimpliFi platform.
      This group has the Login endpoint that allows you to enter into our system. Moreover,
      the endpoint’s response provides you with the access token, which would be used in
      making further API calls.
  - name: 'User'
    description: |-
      The User API Group is designed to manage the users. It is mandatory
      that the users should only be created under a card program. User
      creation could be a one or two step process:

      - Capture user details
      - Conduct user KYC (if required by the regulators)

      Requirements related to what user details need to be captured and the kind of KYC
      required are defined during client onboarding as mandated by the issuing bank and
      regulations, depending on the jurisdiction and the nature of the card program.
  - name: 'Card'
    description: |-
      The Cards API Group is designed to manage all the activities related to the cards
      life cycle. Cards can either be issued in physical or virtual form, or both. Cards
      would inherit the default characteristics of the card program under which they have
      been issued, however, some of these can be changed at the card level. Cards could
      be issued only to a registered user within a card program.
  - name: 'Transaction'
    description: |-
      The Transactions API Group is designed to allow you to have control over the listing of transactions
      that have been processed on a card. These endpoints enable you to get insights of different
      transactions being carried upon certain cards.
  - name: 'Webhook'
    description: |-
      All the asynchronous API calls that are made using the endpoints published by the SimpliFi platform,
      return a webhook. The purpose of these webhooks is to inform the API user about the status of the
      endpoint that was initiated.

      The webhook structure remains the same in all the asynchronously running API calls with the only
      difference in `eventType` field and `eventPayload` object. These two fields are unique for every
      webhook response. `eventType` describes the event for which the webhook was generated and
      `eventPayload` describes the payload for that event.

paths:
  /v1/auth/login/{companyName}:
    post:
      tags:
       - 'Auth'
      security: []
      summary: Login to generate JWT token
      description: |-
        The Login endpoint allows you to login to the SimpliFi platform using the provided
        credentials. If you don't have the credentials already, you can request them through
        [this link](mailto:support@simplifipay.com). The endpoint returns an access token to be
        used in making further API calls. Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/requestUuidParam'
        - name: companyName
          in: path
          description: |-
            This is an internal identifier of your company in the SimpliFi platform. We will
            generate the company name for you and share it. If you don't have it already,
            you can request it through [this link](mailto:support@simplifipay.com).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthRequestModel'
      responses:
        200:
          description: On successful operation JWT token is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseModel'
  /v1/auth/sdk/{companyName}:
    post:
      tags:
       - 'Auth'
      security: []
      summary: Login to generate SDK Admin JWT token
      description: |-
        This Login endpoint allows you to generate an `SDK_ADMIN` token used in the SDK.
        If you don't have the credentials already, you can request them through
        [this link](mailto:support@simplifipay.com). The endpoint returns an access token to be
        used in making further SDK related API calls. Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: companyName
          in: path
          description: |-
            This is an internal identifier of your company in the SimpliFi platform. We will
            generate the company name for you and share it. If you don't have it already,
            you can request it through [this link](mailto:support@simplifipay.com).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SdkAuthRequestModel'
      responses:
        200:
          description: On successful operation JWT token is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseModel'

  /v1/user:
    get:
      tags:
        - 'User'
      summary: List all Users
      description: |-
        The List all Users endpoint retrieves all the existing users, grouped under a company.
        Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: startDate
          in: query
          schema:
            type: string
            format: date
            example: '2025-02-28'
          description: |-
            Represents the start date of the user's registration with the SimpliFi system. Note All the
            dates in the SimpliFi system are stored and displayed in the following format `yyyy-mm-dd hh:mm:ss`
          required: false
        - name: endDate
          in: query
          schema:
            type: string
            format: date
            example: '2025-02-28'
          description: |-
            Represents the end date of the user's registration with the SimpliFi system. Note All the
            dates in the SimpliFi system are stored and displayed in the following format `yyyy-mm-dd hh:mm:ss`
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error10001'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - 'User'
      summary: Create a User
      description: |-
        The Create a User endpoint creates a new user.
        Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRequestModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error20133'
                  - $ref: '#/components/schemas/Error20017'
                  - $ref: '#/components/schemas/Error20001'
                  - $ref: '#/components/schemas/Error20005'
                  - $ref: '#/components/schemas/Error20039'
                  - $ref: '#/components/schemas/Error20011'
                  - $ref: '#/components/schemas/Error20038'
                  - $ref: '#/components/schemas/Error20127'
                  - $ref: '#/components/schemas/Error20018'
                  - $ref: '#/components/schemas/Error20002'
                  - $ref: '#/components/schemas/Error20004'
                  - $ref: '#/components/schemas/Error20006'
                  - $ref: '#/components/schemas/Error20032'
                  - $ref: '#/components/schemas/Error30012'
                  - $ref: '#/components/schemas/Error20086'
                  - $ref: '#/components/schemas/Error20019'
                  - $ref: '#/components/schemas/Error30003'
                  - $ref: '#/components/schemas/Error20132'
                  - $ref: '#/components/schemas/Error20008'
                  - $ref: '#/components/schemas/Error40054'
                  - $ref: '#/components/schemas/Error20015'
                  - $ref: '#/components/schemas/Error20074'
                  - $ref: '#/components/schemas/Error21090'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/user/{uuid}:
    get:
      tags:
        - 'User'
      summary: Retrieve a User
      description: |-
        The Retrieve a User endpoint retrieves details about an existing user.
        Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the user.
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error20046'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags:
        - 'User'
      summary: Update a User
      description: |-
        The Update a User endpoint updates the details of an existing user.
        Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the user.
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRequestModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error20046'
                  - $ref: '#/components/schemas/Error20133'
                  - $ref: '#/components/schemas/Error20017'
                  - $ref: '#/components/schemas/Error20001'
                  - $ref: '#/components/schemas/Error20005'
                  - $ref: '#/components/schemas/Error20039'
                  - $ref: '#/components/schemas/Error20011'
                  - $ref: '#/components/schemas/Error20038'
                  - $ref: '#/components/schemas/Error20127'
                  - $ref: '#/components/schemas/Error20018'
                  - $ref: '#/components/schemas/Error20002'
                  - $ref: '#/components/schemas/Error20004'
                  - $ref: '#/components/schemas/Error20006'
                  - $ref: '#/components/schemas/Error20032'
                  - $ref: '#/components/schemas/Error30012'
                  - $ref: '#/components/schemas/Error20086'
                  - $ref: '#/components/schemas/Error20019'
                  - $ref: '#/components/schemas/Error30003'
                  - $ref: '#/components/schemas/Error20132'
                  - $ref: '#/components/schemas/Error20008'
                  - $ref: '#/components/schemas/Error40054'
                  - $ref: '#/components/schemas/Error20015'
                  - $ref: '#/components/schemas/Error20074'
                  - $ref: '#/components/schemas/Error21090'
                  - $ref: '#/components/schemas/Error20161'
                  - $ref: '#/components/schemas/Error20162'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags:
        - 'User'
      summary: Delete a User
      description: |-
        The Delete a User endpoint deletes an existing user. Deleting a user does not erase data from the
        system but only deactivates the user and its associated cards.
        Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the user.
          required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error20046'
                  - $ref: '#/components/schemas/Error20089'
                  - $ref: '#/components/schemas/Error20089'
                  - $ref: '#/components/schemas/Error20076'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/user/{uuid}/address/{type}:
    post:
      tags:
        - 'User'
      summary: Add update address of user
      operationId: addAddress
      description: |-
        One can either add or update an address of the user. Address type can be either `PRIMARY` or `DELIVERY`
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the user.
          required: true
        - name: type
          in: path
          schema:
            type: string
          description: |-
            This field contains the Address Type, either `PRIMARY` or `DELIVERY`
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequestModel'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'

  /v1/accounts/{userUuid}:
    post:
      tags:
        - 'User'
      summary: Request account opening
      operationId: openAccount
      description: |-
        The Request Account Opening endpoint requests that an underlying account be opened for a
        KYC-approved user. This is an asynchronous call - the endpoint validates the request and
        accepts it for processing; the final result of the account opening is delivered via the
        `CONSUMER_ACCOUNT_PROVISIONED` webhook.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: userUuid
          in: path
          schema:
            type: string
          description: |-
            This is a system-generated unique identifier of the user
            that was created using the Create User API.
          required: true
      responses:
        '202':
          description: Accepted - the account opening request has been accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOpeningResponseModel'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/card:
    get:
      tags:
        - 'Card'
      summary: List all Cards
      description: |-
        The List all Cards endpoint retrieves all the existing cards, grouped under a company.
        Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: cardStatus
          in: query
          schema:
            type: string
            example: 'ACTIVATED,ISSUED,PENDING,LOCKED'
          description: |-
            This field contains comma separated list of card status to filter the request upon.
            List of Active Cards are 'ACTIVATED,ISSUED,PENDING,LOCKED' and a list of Inactive
            Cards are 'REJECTED,DISABLED,REPLACED,EXPIRED'
        - name: page
          in: query
          schema:
            type: string
            format: integer
            example: 0
          description: |-
            This field contains the page number currently being displayed for cards.
          required: false
        - name: size
          in: query
          schema:
            type: string
            format: integer
            example: 10
          description: |-
            This field contains the number of the card records to be displayed on this page.
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardResponseModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error30023'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - 'Card'
      summary: Create a Card
      description: |-
        The Create a Card endpoint creates/issues a card to a user.
        Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRequestModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponseModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error30013'
                  - $ref: '#/components/schemas/Error20046'
                  - $ref: '#/components/schemas/Error20087'
                  - $ref: '#/components/schemas/Error30028'
                  - $ref: '#/components/schemas/Error20070'
                  - $ref: '#/components/schemas/Error40054'
                  - $ref: '#/components/schemas/Error20050'
                  - $ref: '#/components/schemas/Error82028'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/card/{uuid}:
    get:
      tags:
        - 'Card'
      summary: Get Card Details
      description: |-
        The Get Card Details endpoint retrieves all the details of a specific card.
        Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the card.
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponseModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error30004'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/card/{uuid}/status:
    post:
      tags:
        - 'Card'
      summary: Manage Card Status
      description: |-
        The Manage Card Status endpoint manages the status of a card. This endpoint is helpful as
        cards can be locked (temporarily suspended), disabled, reissued depending upon the
        business requirements. Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the card.
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardStatusModel'
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error30004'
                  - $ref: '#/components/schemas/Error30024'
                  - $ref: '#/components/schemas/Error35043'
                  - $ref: '#/components/schemas/Error30025'
                  - $ref: '#/components/schemas/Error99997'
                  - $ref: '#/components/schemas/Error30010'
                  - $ref: '#/components/schemas/Error30047'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/card/{uuid}/renew:
    post:
      tags:
        - 'Card'
      summary: Renewal of the Card
      description: |-
        The Renewal of the Card endpoint renews an expired, lost, or stolen
        card. In this case, a new Primary Account Number (PAN) would be issued.
        Following are the properties of this endpoint.
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the card.
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardRenewalModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'
  /v1/card/{uuid}/card-type:
    post:
      tags:
        - 'Card'
      summary: Request a Physical Card
      description: |-
        The Request a Physical Card endpoint issues a Physical card against the Card UUID of the activated
        virtual card. Note (this endpoint is specific to physical cards and cannot be used for virtual cards.
        Physical cards should be issued only for a virtual card in `ACTIVE` status).
        Following are the properties of this endpoint.

        :::warning[Prepaid Debit/Credit card]
        This API is dependent on card product type (credit/debit)
        :::
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          schema:
            type: string
          description: |-
            This field contains a unique identifier of the card.
          required: true
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/EntityNotFoundError'

  /v1/webhook/events:
    get:
      tags:
        - 'Webhook'
      summary: Get all events
      description: This endpoint fetches all available events for webhooks
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventModel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/webhook:
    post:
      tags:
        - 'Webhook'
      summary: Create a webhook
      description: This endpoint allows you to create a webhook, where events will be posted
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequestModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponseModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error60001'
                  - $ref: '#/components/schemas/Error60002'
                  - $ref: '#/components/schemas/Error60003'
                  - $ref: '#/components/schemas/Error60004'
                  - $ref: '#/components/schemas/Error60005'
                  - $ref: '#/components/schemas/Error60021'
                  - $ref: '#/components/schemas/Error60012'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /webhook/{uuid}:
    put:
      tags:
        - 'Webhook'
      summary: Update a Webhook
      description: This endpoint allows you to update an existing webhook
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          description: This is the unique identifier of the webhook.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponseModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error60009'
                  - $ref: '#/components/schemas/Error60001'
                  - $ref: '#/components/schemas/Error60002'
                  - $ref: '#/components/schemas/Error60003'
                  - $ref: '#/components/schemas/Error60004'
                  - $ref: '#/components/schemas/Error60005'
                  - $ref: '#/components/schemas/Error60021'
                  - $ref: '#/components/schemas/Error60012'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags:
        - 'Webhook'
      summary: Delete a Webhook
      description: This endpoint allows you to delete an existing webhook
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          description: This is the unique identifier of the webhook.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook Deleted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error60009'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /webhook/{uuid}/status:
    put:
      tags:
        - 'Webhook'
      summary: Updates the status of Webhook
      description: This endpoint allows you to update the status of an existing webhook
      parameters:
        - $ref: '#/components/parameters/jwtTokenParam'
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          description: This is the unique identifier of the webhook.
          required: true
          schema:
            type: string
        - name: enable
          in: query
          description: Webhook Status
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponseModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error60009'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

