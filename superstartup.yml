components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    EntityNotFoundError:
      description: Entity not found with the specified UUID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    WebhookSuccessResponse:
      description: Return a 200 status to indicate that the data was received successfully
  parameters:
    jwtTokenParam:
      in: header
      name: Authorization
      description: |-
        This field contains the JWT token that is used to authenticate the user.
      required: true
      schema:
        type: string
        allowEmptyValue: false
    requestUuidParam:
      in: header
      name: requestUuid
      description: |-
        A unique id is required to be passed as part of the header whenever a SimpliFi API is called from your
        system. This would help us in debugging in case of a discrepancy in the expected behavior of the API.
      required: true
      schema:
        type: string
        allowEmptyValue: false
        minLength: 20
        maxLength: 40
        example: '00d366f2-a6e9-4714-b172-02c4e58c29d8'
    webhookTimestampParam:
      in: header
      name: X-SimpliFi-Webhook-Timestamp
      description: |-
        Time in milliseconds when the webhook was sent. This time is the difference between the time
        and midnight, January 1, 1970 UTC.
      required: true
      schema:
        type: string
        allowEmptyValue: false
        example: 1778058412016
    webhookSignatureParam:
      in: header
      name: X-SimpliFi-Webhook-Signature
      description: |-
        The HMAC-SHA256 signature of the webhook payload. This is used to verify that the webhook was sent by SimpliFi.
      required: true
      schema:
        type: string
        allowEmptyValue: false
        example: dIWFyr6BK+5i4r74KiL0XgK7exhF1uX7X0QszXSWCPY=

  schemas:
    ErrorModel:
      type: object
      properties:
        errorCode:
          type: integer
          description: A 5-7 digit number defining the error
          example: '99997'
        message:
          type: string
          description: A brief message defining the error
          example: 'General Error'
    AuthRequestModel:
      type: object
      properties:
        client_id:
          type: string
          description: |-
            The values of this enumeration identify your channel for calling the endpoint.
            Example: If you want to generate the access token to call subsequent APIs from
            your back-end system then use the value `simplifi-api-client`.
          example: simplifi-api-client
        client_secret:
          type: string
          description: |-
            This is a secret identification pattern assigned to you by the SimpliFi platform.
            For each allowed value of “client_id” there is a respective client secret value
            shared with you before the start of the integration. Pass the respective value here.
            If you don't have it already, you can request it through [this link](https://simplifipay.com/).
          example: 31f7f420-f88c-4809-af2e-8a96ed5727d4
        grant_type:
          type: string
          description: |-
            You need to pass this value to log in through the Client Secret shared by SimpliFi.
            Allowed value is `client_credentials`. If you don't already have these credentials,
            you can request them through [this link](https://simplifipay.com/).
          example: client_credentials
      required:
        - client_id
        - client_secret
        - grant_type
    SdkAuthRequestModel:
      type: object
      properties:
        client_id:
          type: string
          description: |-
            The values of this enumeration identify your channel for calling the endpoint.
            Example: If you want to generate the access token to call subsequent APIs from
            your back-end system then use the value `simplifi-portal-client`.
          example: simplifi-portal-client
        client_secret:
          type: string
          description: |-
            This is a secret identification pattern assigned to you by the SimpliFi platform.
            For each allowed value of “client_id” there is a respective client secret value
            shared with you before the start of the integration. Pass the respective value here.
            If you don't have it already, you can request it through [this link](https://simplifipay.com/).
          example: 8fbcf78b-d7e8-44ea-be87-118898f24ab2
        grant_type:
          type: string
          description: |-
            You need to pass this value to log in through the Client Secret shared by SimpliFi.
            Allowed value is `client_credentials`. If you don't already have these credentials,
            you can request them through [this link](https://simplifipay.com/).
          example: client_credentials
        userUuid:
          type: string
          description: |-
            This field contains the unique identifier for the user.
            The token generated would be linked with the supplied user identification, and only work
            with APIs related to the linked user.
          example: '7fe36866-b2fb-42ca-82ee-75d9dd6e0cdd'
      required:
        - client_id
        - client_secret
        - grant_type
        - userUuid
    AuthResponseModel:
      type: object
      properties:
        access_token:
          type: string
          description: |-
            This is the system-generated access token to be used for subsequent calls of the
            same session. It is to be sent as an authorization header along with the
            system-generated token type.
        expires_in:
          type: string
          description: |-
            This is the expiry date/time that defines the validity of the access token.
            Note (one needs to re-login before this expiration time).
        token_type:
          type: string
          description: |-
            This field contains the token type which is coupled with access token to form
            an authorization header. Accepted value is `bearer`.
      required:
        - access_token

    UserRequestModel:
      type: object
      properties:
        username:
          type: string
          description: |-
            This is a unique identifier of the user in the system. We recommend providing a unique name here.
          example: 'john.smith'
        firstName:
          type: string
          description: This is the first name of the user.
          example: 'John'
        middleName:
          type: string
          description: This is the middle name of the user.
          example: 'M'
        lastName:
          type: string
          description: This is the last name of the user.
          example: 'Smith'
        gender:
          type: string
          description: This is the gender of the user.
          example: 'MALE'
          enum:
            - MALE
            - FEMALE
        userDetail:
          $ref: '#/components/schemas/UserDetailModel'
        address:
          $ref: '#/components/schemas/AddressModel'
        contacts:
          type: array
          description: |-
            This array of objects is a collection of contact fields,
            possessing sub-fields explained in the rows below.
          items:
            $ref: '#/components/schemas/ContactModel'
      required:
        - username
        - firstName
        - lastName
        - gender
        - userDetail
        - address
        - contacts
    UserDetailModel:
      type: object
      properties:
        dob:
          type: string
          format: date-time
          description: This field contains the Date of Birth of the user.
          example: '2025-02-28 13:31:00'
        roleName:
          type: string
          description: This field contains a unique identifier showing the role of the user such as `CUSTOMER`
          example: 'CUSTOMER'
          enum:
            - CUSTOMER
            - CLIENT_ADMIN
            - SUPPORT_SPECIALIST
            - OPS_MANAGER
        position:
          type: string
          description: This field contains the position (designation) of the user such as `Employee`
          example: 'Employee'
      required:
        - dob
        - roleName
    AddressModel:
      type: object
      properties:
        addressType:
          type: string
          description: |-
            This field contains the address type. `PRIMARY` address is set during user creation.
          example: 'PRIMARY'
          enum:
            - PRIMARY
            - DELIVERY
        streetAddress:
          type: string
          description: This field contains the street address of the user.
        address2:
          type: string
          description: This field contains the second line of address of the user.
        cityCode:
          type: string
          description: This field contains the city name of the user.
        stateCode:
          type: string
          description: This field contains the state name of the user.
        countryCode:
          type: string
          description: This field contains the country code of the user.
        postalCode:
          type: string
          description: This field contains the postal code of the user.
      required:
        - addressType
        - countryCode
    AddressRequestModel:
      type: object
      properties:
        streetAddress:
          type: string
          description: This field contains the street address of the user.
          example: Dubai
        address2:
          type: string
          description: This field contains the second line of address of the user.
        cityCode:
          type: string
          description: This field contains the city name of the user.
          example: Dubai
        stateCode:
          type: string
          description: This field contains the state name of the user.
          example: DXB
        countryCode:
          type: string
          description: This field contains the country code of the user.
          example: UAE
        postalCode:
          type: string
          description: This field contains the postal code of the user.
          example: 0000
      required:
        - streetAddress
        - cityCode
        - stateCode
        - countryCode
    ContactModel:
      type: object
      properties:
        contactType:
          type: string
          description: This field contains the contact type
          example: 'EMAIL'
          enum:
            - PHONE
            - WHATSAPP
            - EMAIL
        contactValue:
          type: string
          description: This field contains the contact value of the user.
          example: '+971123456789, john.smit@simplifipay.com'
      required:
        - contactType
        - contactValue
    UserModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is a system-generated unique identifier of the user.
          example: 'f242acc1-bcbf-11eb-8529-c070bc3a2323'
        username:
          type: string
          description: This is a unique identifier of the user in the system.
          example: 'johnsmith'
        firstName:
          type: string
          description: This is the first name of the user.
          example: 'John'
        middleName:
          type: string
          description: This is the middle name of the user.
          example: 'M'
        lastName:
          type: string
          description: This is the last name of the user.
          example: 'Smith'
        gender:
          type: string
          description: This is the gender of the user.
          example: 'MALE'
          enum:
            - MALE
            - FEMALE
        userStatus:
          type: string
          description: This is the current status of the user within the SimpliFi system
          example: 'ACTIVE'
          enum:
            - ACTIVE
            - INACTIVE
        kycStatus:
          type: string
          description: This is the current status of the KYC of this user.
          example: 'READY_FOR_KYC'
          enum:
            - NOT_SUBMITTED
            - READY_FOR_KYC
            - APPROVED
            - REJECTED
        createdAt:
          type: string
          format: date-time
          description: |-
            This field contains the date and time when the user was created in the SimpliFi system.
          example: '2025-02-28 13:31:00'
        createdBy:
          type: string
          description: This field contains the UUID of the user who created this user in the SimpliFi system.
          example: 'a49d6f6e-c98b-47db-9d6f-6ec98b77dbf9'
        userDetail:
          $ref: '#/components/schemas/UserDetailModel'
        address:
          $ref: '#/components/schemas/AddressModel'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactModel'
      required:
        - uuid
        - username
        - firstName
        - lastName
        - gender
        - userStatus
        - createdAt
        - userDetail
        - address
        - contacts

    CardRequestModel:
      type: object
      properties:
        userUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the user
            that was created using the Create User API.
          example: 'f5ba1741-983f-4f51-8375-701461c5bacc'
        customerTitle:
          type: string
          description: |-
            This is a specific name for the user to be displayed on the card in addition
            to the cardholder name. This field adds another layer of individuality and exclusivity
            for the user. Also known as 4th line embossing.
          example: 'Founding Member'
        instrument:
          $ref: '#/components/schemas/InstrumentType'
      required:
        - userUuid
        - instrument
    CardResponseModel:
      type: object
      properties:
        uuid:
          type: string
          description: This is a system-generated unique identifier of the card issued.
          example: '8105fb1b-852c-4d93-88eb-2fb2361d4b45'
        userUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the user
            that was created using the Create User API.
          example: '7ace3a56-3cb1-44db-a81d-2735e54c7c15'
        companyUuid:
          type: string
          description: This field contains a unique identifier of the company for which the card has been configured.
          example: '10cdeb1d-c3af-4288-b770-5d7620171f37'
        instrument:
          $ref: '#/components/schemas/InstrumentType'
        creationDate:
          type: string
          format: date-time
          description: This field contains the date on which the card was created.
          example: '2025-02-28 13:31:00'
        cardStatus:
          $ref: '#/components/schemas/CardStatusParameter'
        expiryDate:
          type: string
          description: |-
            This field contains the expiry date of the card.
            The format is `MM/yy`
          example: '12/31'
        maskedPan:
          $ref: '#/components/schemas/MaskedPanParameter'
        cardMode:
          type: string
          description: This field contains the mode of the card.
          example: 'PRIMARY'
          enum:
            - PRIMARY
            - SECONDARY
        currency:
          type: string
          description: This field contains the Primary currency of Card
          example: 'USD'
        customerTitle:
          type: string
          description: This field contains the fourth line embossing of the card.
          example: 'Founding Member'
        physicalCardUuid:
          type: string
          description: This is a system-generated unique identifier of the PHYSICAL card issued.
          example: 'a1f65835-be50-450c-a197-8676aa4565d0'
        linkedVirtualCardUuid:
          type: string
          description: This is a system-generated unique identifier of the linked VIRTUAL card.
          example: '86d3111d-6d55-45e0-91c1-32c1397f39ab'
      required:
        - uuid
        - userUuid
        - companyUuid
        - instrument
        - creationDate
        - cardStatus
        - maskedPan
        - cardMode
        - currency
    AccountOpeningResponseModel:
      type: object
      properties:
        requestUuid:
          type: string
          description: A unique identifier for this account opening request.
          example: '00d366f2-a6e9-4714-b172-02c4e58c29d8'
        status:
          type: string
          description: This field contains the status of the account opening request. `ACCEPTED` means the request was accepted for asynchronous processing.
          example: 'ACCEPTED'
    InstrumentType:
      type: string
      description: This field specifies the type of card that is being issued.
      example: 'VIRTUAL'
      enum:
        - VIRTUAL
        - PHYSICAL
    CardStatusModel:
      type: object
      properties:
        status:
          type: string
          description: This field contains the status of the card.
          example: 'LOCKED'
          enum:
            - LOCKED
            - DISABLED
            - ACTIVATED
        reason:
          type: string
          description: This field specifies the reason for changing the card status.
          example: 'STOLEN'
          enum:
            - ALL_GOOD
            - STOLEN
            - LOST
            - FRAUDULENCE
            - SECURITY_VIOLATION
            - RESTRICTED
            - VOIDED
      required:
        - status
        - reason
    CardRenewalModel:
      type: object
      properties:
        originalCardUuid:
          type: string
          description: This is a system-generated unique identifier of the card being renewed.
        renewedCardUuid:
          type: string
          description: |-
            This is a system-generated unique identifier of the renewed card
            that is issued in place of the original card.
      required:
        - originalCardUuid
        - renewedCardUuid

    WebhookEventType:
      type: string
      enum: [
        PROCESSOR_MAPPING_CREATION,
        CONSUMER_ACCOUNT_PROVISIONED,

        CARD_ACTIVATION,
        CARD_ISSUANCE,
        CARD_PIN_SETUP,
        CARD_RENEWED,
        CARD_STATUS_CHANGE,
        CARD_TYPE_CHANGE,

        CARD_HOLDER_CREATION,
        CARD_HOLDER_UPDATION,
        CARD_HOLDER_DELETION,

        TRANSACTION,
        TRANSACTION_ENRICHMENT
      ]
    WebhookEventModel:
      type: object
      properties:
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
      required:
        - eventType
    WebhookRequestModel:
      type: object
      properties:
        name:
          type: string
          description: A name to uniquely identify the webhook.
          example: 'Card Status Change'
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        endpointUrl:
          type: string
          description: The endpoint URL hosted by you where webhooks will be sent.
          example: 'https://webhook.simplifipay.com'
        extra:
          type: object
          description: A key-value pair of any extra header to be sent when calling the `endpoitnUrl`.
          additionalProperties:
            type: string
      required:
        - name
        - eventType
        - endpointUrl
    WebhookResponseModel:
      type: object
      properties:
        uuid:
          type: string
          description: Unique identifier of the webhook.
          example: '84503d40-93b1-4f1d-b265-41553528a028'
        name:
          type: string
          description: A name to uniquely identify the webhook.
          example: 'Card Status Change'
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          description: Current status of the webhook
          example: 'ENABLED'
          enum:
            - ENABLED
            - DISABLED
        endpointUrl:
          type: string
          description: The endpoint URL hosted by you where webhooks will be sent.
          example: 'https://webhook.simplifipay.com'
        creationDate:
          type: string
          format: date-time
          example: '2025-02-28 13:31:00'
        lastModified:
          type: string
          format: date-time
          example: '2025-02-28 13:31:00'
      required:
        - uuid
        - name
        - eventType
        - status
        - endpointUrl
        - creationDate
        - lastModified

    Webhook:
      type: object
      properties:
        uuid:
          type: string
          description: This field contains the unique uuid of the entity of the event.
          example: '929506e0-0b8f-4572-b492-5d3276c62bc5'
        requestUuid:
          $ref: '#/components/schemas/RequestUuidParameter'
        companyUuid:
          $ref: '#/components/schemas/CompanyUuidParameter'
        requesterUuid:
          type: string
          description: This field contains the unique uuid of the user who generated the request.
          example: 'b0233bfb-10b4-4218-a807-2fef9c99f125'
        requestStatus:
          type: string
          description: This field contains the status of the event, whether it was a success or a failure
          example: 'SUCCESS'
          enum:
            - SUCCESS
            - FAILURE
        errorCode:
          type: string
          description: |-
            This field contains the error code when the `requestStatus` is a `FAILURE`.
            It is a 5-7 digit number defining the error.
        errorMessage:
          type: string
          description: |-
            This field contains the error message when the `requestStatus` is a `FAILURE`.
            It is a brief message defining the error.
        sourceErrorCode:
          type: string
          description: |-
            This field contains the error code, passed down from the processor,
            when the `requestStatus` is a `FAILURE`.
            It is a 5-7 digit number defining the error.
        sourceErrorMessage:
          type: string
          description: |-
            This field contains the error message, passed down from the processor,
            when the `requestStatus` is a `FAILURE`.
            It is a brief message defining the error.
      required:
        - uuid
        - requestUuid
        - requesterUuid
        - companyUuid
        - requestStatus

    CompanyUuidParameter:
      type: string
      description: This field contains the unique uuid of the company.
      example: 'a58cd30e-955a-4905-87e1-4d70a62624f5'
    RequestUuidParameter:
      type: string
      description: This field contains the unique uuid of the request that generated the event.
      example: '19c96ca8-cd68-4a4f-bb43-cd225502cbde'
    ProcessorMappingUuidParameter:
      type: string
      description: This field contains the unique identifier for the processor mapping.
      example: 'b6e70436-b425-48d0-9ef1-eec65ee54a30'
    UserUuidParameter:
      type: string
      description: This field contains the unique identifier for the user.
      example: '7fe36866-b2fb-42ca-82ee-75d9dd6e0cdd'
    CardUuidParameter:
      type: string
      description: This field contains the unique identifier for the card.
      example: 'b55cda10-b930-4314-b32a-57b9cdbf6427'
    MaskedPanParameter:
      type: string
      description: |-
        This field contains the partially hidden Primary Account Number
        i.e. all digits are masked, except for the last four ones.
      example: '**********1234'
    CardStatusParameter:
      type: string
      description: This field contains the current status of the card.
      example: 'ISSUED'
      enum:
        - PENDING
        - ISSUED
        - ACTIVATED
        - DISABLED
        - LOCKED
        - REPLACED
        - REJECTED
        - EXPIRED
    TransactionIdParameter:
      type: string
      description: This is an identifier of the transaction.
      example: '6712309'
    TransactionUuidParameter:
      type: string
      description: This is a unique identifier of the transaction.
      example: 'f0888e10-43e3-4686-9c79-256633d79559'
    TransactionTypeParameter:
      type: array
      description: |-
        This field defines the Transaction types. Allowed values are
        `Auth` - for Authorized transactions
        `Reversal` - for Reversed transactions
        `Settlement` - for Settled transactions
        `Refund` - for Refund transactions
        `Load` - for Card Load transactions
        `Unload` - for Card Unload transactions
        `Fees` - for Fee transactions
      items:
        type: string
        enum:
          - Auth
          - Reversal
          - Settlement
          - Refund
          - Load
          - Unload
          - Fees

