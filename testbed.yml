openapi: 3.1.0
info:
  title: SimpliFi
  description: |-
    Welcome to SimpliFi platform! We are excited that you have taken the time to understand
    how the SimpliFi platform works, so let's start by going through some of the basic
    concepts of data types, API and Webhook structure and default parameters, etc.
  termsOfService: https://simplifipay.com/terms-and-conditions/
  contact:
    email: support@simplifipay.com
  version: 5.x.x
externalDocs:
  description: Find out more about SimpliFi
  url: https://simplifipay.com/
servers:
  - url: https://{env}-lb.simplifipay.com
tags:
  - name: 'Transaction'
    description: |-
      The Transactions API Group is designed to allow you to have control over the listing of transactions
      that have been processed on a card. These endpoints enable you to get insights of different
      transactions being carried upon certain cards.

paths:
  /v1/transaction/{uuid}/classification:
    put:
      tags:
        - 'Transaction'
      summary: Update the Classification Type of the Transaction
      description: |-
        Updates the classification of a transaction to either `BUSINESS` or `PERSONAL`.
      parameters:
        - $ref: '#/components/parameters/requestUuidParam'
        - name: uuid
          in: path
          description: This is a unique identifier of the transaction.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationTypeRequestModel'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    EntityNotFoundError:
      description: Entity not found with the specified UUID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    WebhookSuccessResponse:
      description: Return a 200 status to indicate that the data was received successfully
  parameters:
    requestUuidParam:
      in: header
      name: requestUuid
      description: |-
        A unique id is required to be passed as part of the header whenever a SimpliFi API is called from your
        system. This would help us in debugging in case of a discrepancy in the expected behavior of the API.
      required: true
      schema:
        type: string
        allowEmptyValue: false
        minLength: 20
        maxLength: 40
        example: '00d366f2-a6e9-4714-b172-02c4e58c29d8'

  schemas:
    ErrorModel:
      type: object
      properties:
        errorCode:
          type: integer
          description: A 5-7 digit number defining the error
          example: '99997'
        message:
          type: string
          description: A brief message defining the error
          example: 'General Error'

    ClassificationTypeRequestModel:
      type: object
      properties:
        classificationType:
          type: string
          description: The classification type for the transaction.
          example: "BUSINESS"
          enum:
            - BUSINESS
            - PERSONAL
        reason:
          type: string
          description: Reason for updating the classification type.
          example: "Reclassified after expense review"
      required:
        - classificationType
        - reason
